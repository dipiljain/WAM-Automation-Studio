<template>
  <template if:true={showCard}>
    <c-wam-briefing-header
      persona-label="Advisor"
      subtitle="Review high-priority recommendations, generate client briefings, and follow up on at-risk clients."
      icon-name="utility:trending"
      theme="advisor"
      focus-headline={focusHeadline}
      show-reset="true"
      reset-label="Reset dashboard"
      onreset={handleReset}
    ></c-wam-briefing-header>

    <div class="slds-grid slds-wrap slds-gutters_small">
      <div class="slds-col slds-size_1-of-1">
        <c-wam-metric-tiles
          title="Advisor Cockpit"
          icon-name="standard:coaching"
          subtitle="Your book at a glance."
          tiles={metricTiles}
          loading={metricsLoading}
          error-message={metricError}
        ></c-wam-metric-tiles>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
        <c-wam-insight-list
          title="Needs Your Attention"
          icon-name="utility:warning"
          items={priorityItems}
          loading={priorityLoading}
          error-message={priorityError}
          empty-message="No clients are currently flagged as at-risk."
        ></c-wam-insight-list>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
        <div class="stacked-panel">
          <c-wam-recommendation-list
            title="Top Recommendations"
            items={recommendationItems}
            loading={recommendationsLoading}
            error-message={recommendationError}
          ></c-wam-recommendation-list>
        </div>
        <div class="stacked-panel stacked-panel_last">
          <c-wam-insight-list
            title="Latest Insights"
            items={insightItems}
            loading={insightsLoading}
            error-message={insightError}
          ></c-wam-insight-list>
        </div>
      </div>
    </div>
  </template>
</template>
