<template>
  <template if:true={showCard}>
    <c-wam-briefing-header
      persona-label="Compliance"
      subtitle="Triage open findings, escalate risks, and clear critical portfolio alerts."
      icon-name="utility:shield"
      theme="compliance"
      focus-headline={focusHeadline}
      show-reset="true"
      reset-label="Reset dashboard"
      onreset={handleReset}
    ></c-wam-briefing-header>

    <div class="slds-grid slds-wrap slds-gutters_small">
      <div class="slds-col slds-size_1-of-1">
        <c-wam-metric-tiles
          title="Compliance Command Center"
          icon-name="standard:case"
          subtitle="Firm-wide findings and alerts at a glance."
          tiles={metricTiles}
          loading={metricsLoading}
          error-message={metricError}
        ></c-wam-metric-tiles>
      </div>

      <div class="slds-col slds-size_1-of-1">
        <c-wam-insight-list
          title="Needs Your Attention"
          icon-name="utility:warning"
          items={priorityItems}
          loading={priorityLoading}
          error-message={priorityError}
          empty-message="No open or escalated findings right now."
        ></c-wam-insight-list>
      </div>
    </div>
  </template>
</template>
