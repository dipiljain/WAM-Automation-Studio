<template>
  <lightning-card title={title} icon-name={iconName}>
    <div class="slds-p-horizontal_small slds-p-bottom_x-small">
      <p class="subtitle">{subtitle}</p>
    </div>

    <template if:true={loading}>
      <c-wam-state-panel state="loading"></c-wam-state-panel>
    </template>

    <template if:true={hasError}>
      <c-wam-state-panel
        state="error"
        title="Unable to load metrics"
        message={errorMessage}
      ></c-wam-state-panel>
    </template>

    <template if:true={showEmpty}>
      <c-wam-state-panel
        state="empty"
        title="No metrics yet"
        message={emptyMessage}
      ></c-wam-state-panel>
    </template>

    <template if:true={hasTiles}>
      <div
        class="slds-grid slds-wrap slds-gutters_x-small slds-p-horizontal_small"
      >
        <template for:each={tiles} for:item="tile">
          <div
            key={tile.key}
            class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_xx-small"
          >
            <c-wam-metric-tile
              label={tile.label}
              value={tile.display}
              tone={tile.tone}
              record-url={tile.recordUrl}
              context={tile.context}
            ></c-wam-metric-tile>
          </div>
        </template>
      </div>
    </template>

    <slot></slot>
  </lightning-card>
</template>
